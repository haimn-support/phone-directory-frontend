<!DOCTYPE html>
<!-- Bootstrap CSS -->
<html>
 <head>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <title>Qwilt Phone Directory for NOC </title> 
  <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script type="text/javascript" src="https://ajax.microsoft.com/ajax/jquery.validate/1.7/jquery.validate.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
    
    <!-- This is a JS function for the  Check number part of the form-->
  <script type="text/javascript">
    $(function() {
        // This function will enable the button only if the field is valid
    $('#eng_email').change(function(){
        if (document.getElementById('eng_email').validity.valid){
            console.log(document.getElementById('eng_email').validity.valid)
            document.getElementById('check_num').disabled = false;
            $('#get_result').removeClass("d-none").hide(); 
        }
        else {
            console.log(document.getElementById('eng_email').validity.valid)
            document.getElementById('check_num').disabled = true;
            console.log('Invalid email')
            $('#get_result').removeClass("d-none").hide(); 
        }

    });
        //Function will send GET to API and display the answer
        $("#check_num").click(function(e) {
        e.preventDefault();
        var html = '';
        var email = document.getElementById("eng_email").value;
        var url = window.location.protocol +'//'+ window.location.host.split(':')[0] +':8080/employee/'+ email +'/';
        console.log(url);
        if (email == '') {
            alert('Please enter email to check and try again');
        }
        else {
        $.get( url , function( data ) {
            if (data.error){
                console.log(data.error);
                document.getElementById("get_result").innerHTML = data.error;
                $('#get_result').removeClass("d-none").show();  
                //alert( "Data Loaded: " +  data.error );
            }
            else {
                var frog = window.open("","Results for :" + email ,"scrollbars=1,resizable=1,location=0,width=700,height=700"); 
                var html = "<html><head><title>Results for "+ email +"</title></head><body><h1>Serach results for "+ email + " :</h1>" ;
                html += "<h4>The number is : </h4>" + data.phone + "<h4>The PushOver email is : </h4>" + data.pushover;
                html += "<h4>The Primary resposiblities are : </h4>";
                for (var i=0 ; i< data.primaryResponsiblity.length ; i++) {
                    if (i == 0 ) { 
                        html += data.primaryResponsiblity[i]
                    }
                    else  {
                    html +="<br>" + data.primaryResponsiblity[i]
                    }
                }
                html+= "<br><h4>The Backup resposiblities are :</h4>";
                for (var i=0 ; i< data.backupResponsiblity.length ; i++) {
                    if (i == 0 ) { 
                        html += data.backupResponsiblity[i]
                    }
                    else {
                        html +="<br>" + data.backupResponsiblity[i]
                    }
                }
                html += "</body></html>";
                frog.document.open();
                frog.document.write(html);
                frog.document.close();
                //alert('the number is : ' + data.number);
            }
          }).fail(function(jqXHR, textStatus, errorThrown) {
            if (jqXHR.status == 404 ){
                var responseText = jQuery.parseJSON(jqXHR.responseText);
                console.log(responseText.error);
                console.log(errorThrown);
                document.getElementById("get_result").innerHTML = responseText.error;
                $('#get_result').removeClass("d-none").show();  
                //alert( "Data Loaded: " +  data.error );
            }
          });
        }
    })

    });
    </script>


    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

  </head>
<body>
    <div id="heading">
     <img src="images/QwiltLogo.png" alt="Qwilt" class ="center">
     </div>
    <br><br><br><br>
    <div id= "get_number">
        <fieldset>
            <h3 style="font-weight:bold;">Find number in the directory</h3>
            <br>
            <label for="checked_email">Qwilt Email Address</label>
            <input type="email" class="form-control" title="Enter valid qwilt email address" name="eng_email" id="eng_email" placeholder="JonD@qwilt.com" size="5" value="" required />
        <br>
        <h5 id="get_result" class="d-none"></h5> 
        <button type=button id="check_num" disabled>+ Find Number +</button>
        </fieldset>
    </div>
</body>
<footer>Created by Haim Natan for QWILT SP Support Team - 2021</footer>
</html>
